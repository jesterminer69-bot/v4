<body>
<header>
  <h1>Profit Monkey V4 Status</h1>
  <div class="muted">Strict champion-contract status page. Works from GitHub Pages and local file preview.</div>
</header>
<main>
  <div id="app"><div class="notice">Loading status...</div></div>
</main>
<script>
function esc(v) {
  if (v === null || v === undefined || v === '') return 'n/a';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pct(v) {
  if (v === null || v === undefined || v === '') return 'n/a';
  const n = Number(v);
  if (!Number.isFinite(n)) return esc(v);
  return n.toFixed(2) + '%';
}
function num(v, d=2) {
  if (v === null || v === undefined || v === '') return 'n/a';
  const n = Number(v);
  if (!Number.isFinite(n)) return esc(v);
  return n.toLocaleString(undefined, {maximumFractionDigits:d, minimumFractionDigits:d});
}
function clsForPct(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '';
  if (n > 0) return 'good';
  if (n < 0) return 'bad';
  return 'warn';
}
function render(data, sourceLabel) {
  const s = data.summary || {};
  const a = data.last_action || {};
  const champs = data.active_champions || [];
  const idle = a.state === 'LIKELY IDLE';
  const html = `
    <section class="grid">
      <div class="card"><div class="label">Tested APR</div><div class="value ${clsForPct(s.tested_apr_percent)}">${esc(s.tested_apr_display || pct(s.tested_apr_percent))}</div></div>
      <div class="card"><div class="label">Total Return</div><div class="value ${clsForPct(s.total_return_percent)}">${esc(s.total_return_display || pct(s.total_return_percent))}</div></div>
      <div class="card"><div class="label">Max Drawdown</div><div class="value bad">${esc(s.max_drawdown_display || pct(s.max_drawdown_pct))}</div></div>
      <div class="card"><div class="label">Trades</div><div class="value">${esc(s.trade_count || 0)}</div></div>
      <div class="card"><div class="label">Fees Paid</div><div class="value">${esc(s.fees_paid_display || num(s.fees_paid))}</div></div>
      <div class="card"><div class="label">Bot State</div><div class="value ${idle ? 'warn' : 'good'}">${esc(a.state || 'UNKNOWN')}</div></div>
    </section>
    <section class="notice">
      <strong>Last bot action:</strong> ${esc(a.label)}<br>
      <strong>Last update:</strong> ${esc(a.time)} ${a.age_minutes !== null && a.age_minutes !== undefined ? '(' + esc(a.age_minutes) + ' min ago)' : ''}<br>
      <strong>Data source:</strong> ${esc(sourceLabel)}<br>
      <strong>Generated:</strong> ${esc(data.generated_at)}
    </section>
    <h2>Active Champions</h2>
    <table>
      <thead><tr>
        <th>Regime</th><th>Champion</th><th>Generation</th><th>Last promoted</th><th>Health</th><th>Regime return</th><th>Trades</th><th>Entry</th><th>Exit</th><th>Core params</th>
      </tr></thead>
      <tbody>
        ${champs.map(c => `
          <tr>
            <td><strong>${esc(c.regime)}</strong><br><span class="small muted">${esc(c.family)}</span></td>
            <td><code>${esc(c.champion_id)}</code></td>
            <td>${esc(c.generation)}</td>
            <td>${esc(c.last_promoted)}</td>
            <td><span class="pill">${esc(c.health)}</span></td>
            <td class="${clsForPct(c.regime_return_pct)}">${pct(c.regime_return_pct)}</td>
            <td>${esc(c.regime_trades)}</td>
            <td>${esc(c.entry_rule)}</td>
            <td>${esc(c.exit_rule)}</td>
            <td class="small">
              buy ${num(c.buy_fraction,4)} / max ${num(c.max_exposure,4)}<br>
              PT ${pct(c.profit_target_pct)} / SL ${pct(c.stop_loss_pct)} / trail ${pct(c.trailing_stop_pct)}<br>
              cooldown ${esc(c.min_bars_between_buys)} bars / DCA ${c.dca_enabled ? 'on' : 'off'}
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    <section class="notice small">
      Local preview note: this page embeds status data directly so it works when opened from disk. GitHub Pages also receives status_data.json for external tooling.
    </section>`;
  document.getElementById('app').innerHTML = html;
}
async function load() {
  // On GitHub Pages, status_data.json fetch works and may be fresher if someone edits it separately.
  // On local file:// preview, Chrome/Edge can throw TypeError: Failed to fetch. Fall back silently.
  if (location.protocol !== 'file:') {
    try {
      const r = await fetch('status_data.json?ts=' + Date.now(), {cache:'no-store'});
      if (r.ok) {
        const data = await r.json();
        render(data, 'status_data.json');
        return;
      }
    } catch (e) {}
  }
  render(window.PMV4_STATUS_DATA || {}, 'embedded status data');
}
load();
</script>
