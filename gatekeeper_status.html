<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta http-equiv='refresh' content='30'><title>PMV4 Gatekeeper</title><style>
:root{--bg:#0b0f14;--panel:#121a24;--panel2:#172231;--text:#ecf2f8;--muted:#9fb0c3;--accent:#67d4ff;--good:#7ee787;--bad:#ff7b72;--warn:#f2cc60;--line:#26364a}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#081018,#0b0f14);color:var(--text);font-family:Segoe UI,Arial,sans-serif;line-height:1.45} a{color:var(--accent);text-decoration:none}.wrap{max-width:1320px;margin:0 auto;padding:28px}.hero{padding:28px;border:1px solid var(--line);border-radius:20px;background:rgba(18,26,36,.92);box-shadow:0 18px 60px rgba(0,0,0,.32)}h1{font-size:36px;margin:0 0 8px}h2{font-size:22px;margin:0 0 16px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.metric{font-size:30px;font-weight:800}.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel2);margin:3px 6px 3px 0;font-size:13px}.section{margin-top:22px}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{background:var(--panel2);color:#dbe9f7;position:sticky;top:0}tr:last-child td{border-bottom:0}.mono{font-family:Consolas,Menlo,monospace;font-size:12px}.nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.nav a{padding:10px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}.callout{border-left:4px solid var(--warn);background:rgba(242,204,96,.08);padding:14px;border-radius:12px;margin:12px 0}.footer{margin-top:28px;color:var(--muted);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px}th,td{font-size:12px;padding:8px}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
