<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profit Monkey V4</title>
  <style>
    :root { color-scheme: dark; --bg:#090d13; --card:#121a25; --text:#eef4ff; --muted:#9fb1c7; --line:#28384d; --accent:#7dd3fc; }
    body { margin:0; font-family:Segoe UI, Arial, sans-serif; background:radial-gradient(circle at top left,#162437,#090d13 55%); color:var(--text); }
    main { max-width:1100px; margin:0 auto; padding:36px 20px; }
    .card { background:rgba(18,26,37,.9); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 14px 40px rgba(0,0,0,.3); }
    h1 { margin:0 0 8px; font-size:42px; }
    p { color:var(--muted); line-height:1.5; }
    a.button { display:inline-block; margin-top:18px; padding:12px 18px; border-radius:12px; background:var(--accent); color:#041019; text-decoration:none; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:18px; }
    .metric { background:#0c131d; border:1px solid var(--line); border-radius:14px; padding:16px; }
    .label { color:var(--muted); font-size:13px; }
    .value { font-size:24px; font-weight:800; margin-top:6px; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Profit Monkey V4</h1>
    <p>GitHub Pages hub for strict V4 validation, champion status, and future reports.</p>
    <div class="grid">
      <div class="metric"><div class="label">Tested APR</div><div class="value">0.61%</div></div>
      <div class="metric"><div class="label">Bot state</div><div class="value">RECENT ACTIVITY</div></div>
      <div class="metric"><div class="label">Generated</div><div class="value" style="font-size:15px">2026-05-23T04:16:22+00:00</div></div>
    </div>
    <a class="button" href="status.html">Open Status Page</a>
  </section>
</main>
</body>
</html>
